[vars.game]
# query = "SELECT Name FROM Event"
query = """
select a.name as id, COUNT(*) AS odds
from Event a
WHERE a.ID IN (
	SELECT b.ID
	FROM Event b
	WHERE b.Name = a.Name
	LIMIT 30)
AND EXISTS (SELECT * FROM SetResult s WHERE s.EventID = a.ID)
GROUP BY Name
ORDER BY Name
"""

[vars.placement]
values = ["3", "8"]

[vars.placement_entrants]
values = [{label = "Won", id = "1", placement = "1", entrants = "1", entrantsLabel = ""}, 
	{label = "Top 3 in", id = "3-8", placement = "3", entrants = "8", entrantsLabel = "(8+ entrants)"},
	{label = "Top 3 in", id = "3-16", placement = "3", entrants = "16", entrantsLabel = "(16+ entrants)", odds = 0},
	{label = "Top 8 in", id = "8-16", placement = "8", entrants = "16", entrantsLabel = "(16+ entrants)"}]

[vars.win_count]
values = ["1", "5", "10"]

[vars.year]
query = "SELECT DISTINCT strftime('%Y', StartAt, 'unixepoch') FROM Tournament"

[vars.stream_game]
var = "stream_game"
query = "SELECT DISTINCT Game FROM Stream"

[vars.miscdata]
var = "miscdata"
query = "SELECT name FROM pragma_table_info('MiscData') WHERE name != 'ID'"

[vars.gtlt]
values = [{id = ">", label = "above"}, {id = "<", label = "below"}]

[vars.controller]
query = "SELECT DISTINCT Controller FROM Controller"

[vars.game_char]
query = """
SELECT concat(Game, Character) AS id, Game as game, Character as character
FROM Character
GROUP BY Game, Character
HAVING COUNT(*) > 5
"""


[queries.game]
label = "[game]"
query = """
SELECT DISTINCT p.Name FROM EVENT e 
JOIN Standing s ON s.EventID = e.ID 
JOIN Player p ON p.ID = s.PlayerID 
JOIN SetResult sr ON loserScore != -1 AND (winnerID = p.id OR loserID = p.id) AND sr.eventID = e.id
WHERE e.Name = "[game]"
"""
odds = 400

[queries.game_place]
label = "Top [placement] in [game]"
query = """
SELECT DISTINCT p.Name FROM EVENT e
JOIN Standing s ON s.EventID = e.ID
JOIN Player p ON p.ID = s.PlayerID
WHERE e.Name = "[game]" AND s.Standing <= [placement]
"""
odds = 125

[queries.place_2]
label = "[placement_entrants.label] 2 games in the same event [placement_entrants.entrantsLabel]"
query = """
SELECT DISTINCT p.Name
FROM EVENT e
JOIN (SELECT EventID, COUNT(*) AS Count FROM Standing GROUP BY EventId) entrants ON entrants.EventID = e.ID
JOIN Standing s ON s.EventID = e.ID
JOIN Player p ON p.ID = s.PlayerID
WHERE s.Standing <= [placement_entrants.placement] AND entrants.Count >= [placement_entrants.entrants]
GROUP BY e.TournamentID, p.Name
HAVING COUNT(*) > 1
"""
odds = 25

[queries.year]
label = "Has entered a Trials event in [year]"
query = """
select distinct p.Name
from Tournament t
join Event e on e.TournamentID = t.id
join Standing s on s.EventID = e.ID
join player p on p.id = s.PlayerID
where strftime('%Y', StartAt, 'unixepoch') = '[year]'
"""
odds = 50

[queries.game_win]
label = "[game] winner"
query = """
select distinct p.Name
from Standing s
join Event e on e.ID = s.EventID
join Player p on p.id = s.PlayerID
where s.Standing = 1 and e.Name = "[game]"
"""
odds = 50

[queries.wins]
label = "[win_count] or more tournament win(s)"
query = """
select p.Name
from Standing s
join Event e on e.ID = s.EventID
join Player p on p.id = s.PlayerID
where s.Standing = 1
group by p.name
having count(*) >= [win_count]
"""
odds = 50

[queries.stream]
label = "Been on stream"
query = """
select distinct name
from (select player1 as name from Stream union select player2 from Stream) s
"""
odds = 50

[queries.game_stream]
label = "On stream in [stream_game]"
query = """
select distinct name
from (select player1 as name, game from Stream union select player2, game from Stream) s
where s.game = "[stream_game]"
"""
odds = 50

[queries.miscdata]
label = "[miscdata]"
query = """
select distinct p.Name
from Player p
join MiscData m ON m.id = p.id AND m."[miscdata]" = 'Y'
"""
odds = 100

[queries.controller]
label = "[controller]"
query = """
select distinct p.Name
from Player p
join Controller c ON c.id = p.id
WHERE c.Controller = '[controller]'
"""
odds = 50

[queries.character]
label = "[game_char.character] ([game_char.game])"
query = """
select distinct p.Name
from Player p
JOIN Character c ON p.id = c.id
WHERE c.Game = '[game_char.game]' AND c.Character = "[game_char.character]"
"""
odds = 75

[queries.set_len]
label = "Average set length [gtlt.label] 10 minutes"
query = """
select Name
from Player
JOIN SetResult r ON r.winnerID = Player.ID OR r.loserID = player.ID
WHERE r.loserScore > -1 AND r.duration BETWEEN 120 AND 1200
GROUP BY Name
HAVING AVG(r.duration) [gtlt] 600
"""
odds = 10

[queries.set_win_pct]
label = "Lifetime set win % [gtlt.label] 50% (min 10 games played)"
query = """
select Name
from Player
join (select winnerID, count(*) as count from SetResult where loserScore > -1 group by winnerID) w on w.winnerID = Player.ID
join (select loserID, count(*) as count from SetResult where loserScore > -1 group by loserID) l on l.loserID = Player.ID
group by Name
having SUM(w.count) > 10 AND SUM(w.count) * 1.0 / (SUM(w.count) + SUM(l.count)) [gtlt] 0.5
"""
odds = 10

[queries.nov_6]
label = "November 6th birthday"
query = """SELECT Name FROM Player WHERE Name IN ("SlabofBeef", "Zeal", "ThereGoesMySanity")"""
odds = 5

[queries.nathan]
label = "Named Nathan"
query = """SELECT Name FROM Player WHERE Name IN ("SlabofBeef", "MeatyShield", "Ichi", "Sykom", "Hanu", "RYfT")"""
odds = 5
